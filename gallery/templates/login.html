{% extends 'base.html' %}

{% block title %}Log In - The Monolith{% endblock %}

{% block content %}
    <h2>Curator Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Log In</button>
    </form>
    <p>Forgot your password? <a href="{% url 'password_reset' %}">Reset it here</a></p>
{% endblock %}
