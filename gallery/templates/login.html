{% extends 'base.html' %}
{% load socialaccount %}

{% block title %}Log In - The Monolith{% endblock %}

{% block content %}
    <h2>Curator Login</h2>
    
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Log In</button>
    </form>

    <hr style="margin: 2rem 0; border:0; border-top:1px solid #e6e2dd;">

    <a href="{% provider_login_url 'google' %}" class="btn" style="display:inline-block; text-align:center;">
        Sign up with Google
    </a>

    <p style="margin-top: 1.5rem;">Forgot your password? <a href="{% url 'password_reset' %}">Reset it here</a></p>
{% endblock %}
