{% extends "base.html" %}

{% block content %}
<div class="container mx-auto mt-8">
  <div class="max-w-md mx-auto bg-[#fbf7f4] border border-[#3b2f2f] rounded-lg shadow-md overflow-hidden">
    <div class="bg-[#e6e2dd] px-6 py-4 border-b border-[#3b2f2f]">
      <h3 class="text-center text-xl font-semibold text-[#3b2f2f]">Password Reset Complete</h3>
    </div>
    <div class="px-6 py-4 text-center">
      <p class="text-sm text-[#3b2f2f] mb-6">
        Your password has been set. You may now go ahead and log in with your new credentials.
      </p>
      <a href="{% url 'login' %}" class="inline-block w-full bg-[#b85d36] hover:bg-[#a04e2b] text-white font-semibold py-2 px-4 rounded">
        Log In
      </a>
    </div>
  </div>
</div>
{% endblock %}
