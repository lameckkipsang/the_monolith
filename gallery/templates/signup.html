{% extends 'base.html' %}

{% block title %}Sign Up - The Monolith{% endblock %}

{% block content %}
    <h2>Register as a Curator</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
{% endblock %}
