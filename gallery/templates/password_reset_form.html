{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container mx-auto mt-8">
  <div class="max-w-md mx-auto bg-[#fbf7f4] border border-[#3b2f2f] rounded-lg shadow-md overflow-hidden">
    <div class="bg-[#e6e2dd] px-6 py-4 border-b border-[#3b2f2f]">
      <h3 class="text-center text-xl font-semibold text-[#3b2f2f]">Reset Password</h3>
    </div>
    <div class="px-6 py-4">
      <p class="text-sm text-[#3b2f2f] mb-4 text-center">
        Enter your email address below and we'll send you instructions to reset your password.
      </p>
      <form method="post">
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-6">
          <button type="submit" class="w-full bg-[#b85d36] hover:bg-[#a04e2b] text-white font-semibold py-2 px-4 rounded focus:outline-none">
            Send Reset Email
          </button>
        </div>
      </form>
      <p class="mt-4 text-center text-sm text-[#3b2f2f]">
        Remembered your password? <a href="{% url 'login' %}" class="text-[#b85d36] font-semibold hover:underline">Log In</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
