<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}The Monolith{% endblock %}</title>
    <style>
        :root {
            --bg-color: #f7f4ef;          
            --card-bg: #ffffff;
            --text-main: #3b302a;         
            --text-muted: #7c6f64;       
            --accent: #b85d34;           
            --accent-hover: #9c4c28;      
            --border-color: #e3ded6;    
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1.2rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 a {
            color: var(--text-main);
            letter-spacing: 0.05em;
        }

        nav a {
            margin-left: 1.5rem;
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: var(--accent);
        }

        main {
            max-width: 1000px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        footer {
            text-align: center;
            padding: 2.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            border-top: 1px solid var(--border-color);
            margin-top: 5rem;
            background: var(--card-bg);
        }

        .btn {
            background: var(--accent);
            color: #ffffff;
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
            display: inline-block;
            transition: background 0.2s ease;
        }

        .btn:hover {
            background: var(--accent-hover);
        }

        /* Form styling enhancements */
        input, textarea, select {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.3rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: #ffffff;
            color: var(--text-main);
            box-sizing: border-box;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: var(--accent);
        }
    </style>
</head>
<body>
    <header>
        <h2><a href="{% url 'home' %}" style="text-decoration:none;">The Monolith</a></h2>
        <nav>
            <a href="{% url 'home' %}">Exhibition</a>
            {% if request.user.is_authenticated %}
                <a href="{% url 'profile' %}">Profile</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:transparent; border:none; color:#7c6f64; font-weight:500; cursor:pointer; font-size:1rem; padding:0; margin-left:1.5rem;">Log Out</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Log In</a>
                <a href="{% url 'signup' %}">Sign Up</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 The Monolith Gallery. Curated in Earth Tones.</p>
    </footer>
</body>
</html>
