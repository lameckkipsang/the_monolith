{% extends 'base.html' %}

{% block title %}Profile - The Monolith{% endblock %}

{% block content %}
    <h2>Your Curator Profile</h2>
    <a href="{% url 'home' %}">&larr; Back to Exhibition</a>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <h3>Account Information</h3>
        {{ account_form.as_p }}
        
        <h3>Profile Details</h3>
        {{ profile_form.as_p }}
        
        <button type="submit">Update Profile</button>
    </form>
{% endblock %}
